<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>移动端上传示例</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    h2 { font-size: 18px; margin-bottom: 16px; color: #333; }

    /* ---- 公共卡片 ---- */
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .card-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 4px; }
    .card-desc  { font-size: 12px; color: #999; margin-bottom: 12px; }

    /* ---- 隐藏原生 input ---- */
    input[type="file"] { display: none; }

    /* ---- 基础 btn ---- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 10px 20px; border-radius: 8px; font-size: 14px; border: none;
      cursor: pointer; transition: opacity .15s;
    }
    .btn:active { opacity: .7; }
    .btn-primary { background: #0052d9; color: #fff; }
    .btn-block  { width: 100%; }

    /* ---- 例 1：基础按钮 ---- */
    .example1 .upload-area { display: flex; align-items: center; gap: 12px; }
    .example1 .file-name { font-size: 13px; color: #666; word-break: break-all; }

    /* ---- 例 2：点击卡片区域上传 ---- */
    .upload-box {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 140px; border: 2px dashed #ddd; border-radius: 12px;
      background: #fafafa; cursor: pointer; transition: border-color .2s;
    }
    .upload-box:active { border-color: #0052d9; }
    .upload-box .icon { font-size: 36px; color: #bbb; margin-bottom: 8px; }
    .upload-box .hint { font-size: 13px; color: #999; }
    .upload-box .sub-hint { font-size: 11px; color: #bbb; margin-top: 4px; }

    /* ---- 例 3：预览缩略图 ---- */
    .preview-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .preview-item {
      width: 80px; height: 80px; border-radius: 8px; overflow: hidden;
      position: relative; border: 1px solid #eee;
    }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .preview-item .del {
      position: absolute; top: 2px; right: 2px;
      width: 20px; height: 20px; border-radius: 50%;
      background: rgba(0,0,0,.5); color: #fff; font-size: 12px; line-height: 20px;
      text-align: center; cursor: pointer;
    }
    .add-btn {
      width: 80px; height: 80px; border: 1px dashed #ccc; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; color: #bbb; cursor: pointer;
    }
    .add-btn:active { border-color: #0052d9; color: #0052d9; }

    /* ---- 例 4：拍照 & 相册 ---- */
    .action-sheet { display: flex; gap: 10px; }
    .action-sheet .btn { flex: 1; }

    /* ---- 例 5：多选 + 列表 ---- */
    .file-list { list-style: none; }
    .file-list li {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; color: #555;
    }
    .file-list li:last-child { border-bottom: none; }
    .file-list .size { color: #aaa; font-size: 12px; margin-left: 8px; white-space: nowrap; }
  </style>
</head>
<body>

<h2>📷 移动端上传示例</h2>

<!-- ==================== 例 1：基础按钮上传 ==================== -->
<div class="card example1">
  <div class="card-title">例 1 — pdf，图片文档等混合</div>
  <div class="card-desc">accept(.pdf,.doc,.docx,.ppt,.png,.jpg)</div>
  <div class="upload-area">
    <label class="btn btn-primary" for="file1">选择图片</label>
    <input id="file1" type="file" accept=".pdf,.doc,.docx,.ppt,.png,.jpg">
    <span class="file-name" id="fileName1"></span>
  </div>
</div>

<!-- ==================== 例 2：点击卡片区域上传 ==================== -->
<div class="card">
  <div class="card-title">例 2 — 图片视频混合</div>
  <div class="card-desc">accept(.png,.jpg,.ppt,.mp4,.mov,.hevc)</div>
  <label for="file2">
    <div class="upload-box">
      <span class="icon">+</span>
      <span class="hint">点击上传 PNG 图片</span>
      <span class="sub-hint" id="fileHint2">未选择文件</span>
    </div>
  </label>
  <input id="file2" type="file" accept=".png,.jpg,.ppt,.mp4,.mov,.hevc">
</div>

<!-- ==================== 例 3：多张上传 + 缩略图预览 ==================== -->
<div class="card">
  <div class="card-title">例 3 — 文档</div>
  <div class="card-desc">accept(.pdf,.doc,.docx)</div>
  <div class="preview-row" id="previewRow">
    <label for="file3" class="add-btn">+</label>
  </div>
  <input id="file3" type="file" accept=".pdf,.doc,.docx" multiple>
</div>

<!-- ==================== 例 4：拍照 / 相册分开 ==================== -->
<div class="card">
  <div class="card-title">例 4 — 所有图片</div>
  <div class="card-desc">accept(image/*)</div>
  <label class="btn btn-primary" for="fileAlbum">选择所有图片</label>
  <div class="action-sheet">
    <input id="fileAlbum" type="file" accept="image/*">
  </div>
  <div id="cameraResult" style="margin-top:12px;font-size:13px;color:#666;"></div>
</div>

<!-- ==================== 例 5：多选列表展示 ==================== -->
<div class="card">
  <div class="card-title">例 5 — 所有文件</div>
  <div class="card-desc">所有文件都可选，不设置accept</div>
  <label class="btn btn-primary" for="file5">选择所有文件</label>
  <input id="file5" type="file">
  <ul class="file-list" id="fileList" style="margin-top:12px;"></ul>
</div>

<div class="card">
  <div class="card-title">例 6 — 所有文件（设置accept: "*/*"）</div>
  <div class="card-desc">所有文件都可选，设置accept</div>
  <label class="btn btn-primary" for="file6">根据*/*选择所有文件</label>
  <input id="file6" accept="*/*" type="file">
  <ul class="file-list" id="fileList" style="margin-top:12px;"></ul>
</div>

</body>
</html>
